name: Env Demo

on: workflow_dispatch

env:
  WORKFLOW_VAR: "workflow-level"

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "job-level"

    steps:
      - name: Step variable
        env:
          STEP_VAR: "step-level"
        run: |
          echo "Workflow var: $WORKFLOW_VAR"
          echo "Job var: $JOB_VAR"
          echo "Step var: $STEP_VAR"

      - name: Dump all env vars
        run: printenv
